<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shantubag Agro Tourism - Booking Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #a8edea, #fed6e3);
      padding: 30px;
      margin: 0;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 12px 20px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      background: #6c63ff;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #4e47d6;
    }
    #qrCode {
      display: none;
      text-align: center;
      margin-top: 15px;
    }
    #qrCode img {
      max-width: 180px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .hidden { display: none; }
    .total-box {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>

  <form id="bookingForm" action="submit_booking.php" method="POST" enctype="multipart/form-data">
    <h2>Booking Form</h2>

    <label for="name">Full Name:</label>
    <input type="text" name="name" id="name" required>

    <label for="email">Email Address:</label>
    <input type="email" name="email" id="email" required>

    <label for="phone">Mobile Number:</label>
    <input type="tel" name="phone" id="phone" pattern="[0-9]{10}" required>

    <!-- Booking Type -->
    <label for="booking_type">Booking Type:</label>
    <select name="booking_type" id="booking_type" required onchange="toggleBookingType()">
      <option value="">-- Select Booking Type --</option>
      <option value="room">Room Booking</option>
      <option value="package">Package Booking</option>
    </select>

    <!-- Room Booking Section -->
    <div id="roomSection" class="hidden">
      <label for="room">Select Room:</label>
      <select name="room" id="room" onchange="calculateTotal()">
        <option value="">-- Select Room --</option>
        <option value="Cottage" data-price="2000">Cottage - ₹2000 per night</option>
        <option value="Tent" data-price="1000">Tent - ₹1000 per night</option>
        <option value="Dormitory" data-price="500">Dormitory - ₹500 per night</option>
      </select>

      <label for="checkin">Check-in Date:</label>
      <input type="date" name="checkin" id="checkin">

      <label for="checkout">Check-out Date:</label>
      <input type="date" name="checkout" id="checkout">
    </div>

    <!-- Package Booking Section -->
    <div id="packageSection" class="hidden">
      <label for="package">Select Package:</label>
      <select name="package" id="package" onchange="calculateTotal()">
        <option value="">-- Select Package --</option>
        <option value="DayOut" data-price="800">Day Outing - ₹800 per person</option>
        <option value="Weekend" data-price="1500">Weekend Package - ₹1500 per person</option>
        <option value="Family" data-price="2500">Family Package - ₹2500 per person</option>
      </select>
    </div>

    <!-- Guests -->
    <label for="guests">Number of Guests:</label>
    <input type="number" name="guests" id="guests" min="1" value="1" onchange="calculateTotal()">

    <!-- Total Price -->
    <div class="total-box" id="totalPrice">Total: ₹0</div>

    <!-- Payment -->
    <label for="payment_mode">Payment Mode:</label>
    <select name="payment_mode" id="payment_mode" onchange="toggleQRCode()" required>
      <option value="">-- Select Payment Mode --</option>
      <option value="UPI">UPI</option>
      <option value="Cash">Cash</option>
    </select>

    <div id="qrCode">
      <label>Scan UPI QR Code to Pay:</label><br>
      <img src="img/QR.jpeg" alt="UPI QR Code">
      <p><strong>UPI ID:</strong> shantubag@upi</p>
    </div>

    <label for="receipt">Upload Payment Receipt:</label>
    <input type="file" name="receipt" id="receipt" accept=".jpg, .jpeg, .png, .pdf">

    <button type="submit">Submit Booking</button>
  </form>

  <script>
    function toggleBookingType() {
      const type = document.getElementById("booking_type").value;
      document.getElementById("roomSection").classList.add("hidden");
      document.getElementById("packageSection").classList.add("hidden");

      if (type === "room") document.getElementById("roomSection").classList.remove("hidden");
      if (type === "package") document.getElementById("packageSection").classList.remove("hidden");

      calculateTotal();
    }

    function calculateTotal() {
      const type = document.getElementById("booking_type").value;
      const guests = parseInt(document.getElementById("guests").value) || 1;
      let price = 0;

      if (type === "room") {
        const room = document.getElementById("room");
        price = parseInt(room.options[room.selectedIndex]?.dataset.price || 0);
      }
      if (type === "package") {
        const pkg = document.getElementById("package");
        price = parseInt(pkg.options[pkg.selectedIndex]?.dataset.price || 0) * guests;
      }

      document.getElementById("totalPrice").textContent = "Total: ₹" + price;
    }

    function toggleQRCode() {
      const paymentMode = document.getElementById("payment_mode").value;
      document.getElementById("qrCode").style.display = (paymentMode === "UPI") ? "block" : "none";
    }
  </script>

</body>
</html>
